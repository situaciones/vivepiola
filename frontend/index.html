<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- PWA: instalable en el telefono, con la marca y el color de la app. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0A0A0F" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SINCONFLICTO" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..800&display=swap"
      rel="stylesheet"
    />
    <!-- El titulo dice QUE ES antes que como se llama (la marca todavia no es
         conocida) y habla del resultado, no de las multas: lo que se queda
         grabado de un titulo es la palabra que asusta. No prometer aqui nada
         que la app aun no haga (por ejemplo, reclamos por WhatsApp). -->
    <title>SINCONFLICTO · Convivencia ordenada para condominios de Chile</title>
    <meta
      name="description"
      content="Reclamos con prueba, reglas claras y derecho a apelar. La IA encuentra en tu reglamento la norma que aplica, y la administración y el Comité tienen cada paso respaldado."
    />
    <link rel="canonical" href="https://sinconflicto.cl/" />
    <!-- Vista previa al compartir el enlace: WhatsApp y LinkedIn piden URL
         absoluta y JPG o PNG de 1200x630. -->
    <meta property="og:site_name" content="SINCONFLICTO" />
    <meta property="og:locale" content="es_CL" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sinconflicto.cl/" />
    <meta property="og:title" content="En tu edificio, las reglas son iguales para todos" />
    <meta
      property="og:description"
      content="Primero se avisa, siempre se puede apelar y cada paso queda sellado. Menos trabajo para la administración y el Comité, con respaldo si alguien reclama."
    />
    <meta property="og:image" content="https://sinconflicto.cl/img/compartir.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="SINCONFLICTO: en tu edificio, las reglas son iguales para todos" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
